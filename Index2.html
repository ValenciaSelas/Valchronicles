<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="stylesheet" href="styles.css" />
<meta charset="UTF-8" />
<title>Livre avec doubles pages</title>
<style>
/* Ajoute ces lignes au début de ton style pour que la hauteur soit bien définie partout */
  html, body {
    height: 100%;
    margin: 0;
}

  body {
    margin: 0;
    background-color: #f0e6d2;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
  }

  #control-panel {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(255,255,255,0.8);
    padding: 8px;
    border-radius: 4px;
    font-size: 14px;
    z-index: 1000;
  }

  #top-space, #bottom-space {
    height: 5vh;
  }

  #book {
	width: 100vw; /* toute la largeur de l'écran */
	height: 100%;
	max-width: 1200px; /* limite maximale pour grand écran */
	display: flex;
	justify-content: center;
	align-items: center;
  }

  #contenu {
	width: 100%; /* occupe toute la largeur de #book */
	height: 98%; /* hauteur adaptée */
	background: #fff;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
    padding: 0px;
	padding-bottom: 50px; /* Ajoute cet espace en bas */
    overflow: auto;
    box-sizing: border-box; /* pour inclure paddings dans la taille */
	position: relative; /* Ajoute ceci */
  }

  /* Boutons navigation */
  .nav-button {
    position: absolute;
    bottom: 10px;
    width: 40px;
    height: 30px;
    font-size: 32px;
    line-height: 30px;
    text-align: center;
    cursor: pointer;
    opacity: 0.7;
    font-family: Arial, sans-serif;
    color: black;
  }

  .corner-left {
    left: 10px;
  }
  .corner-right {
    right: 10px;
  }
</style>
</head>
<body>
  <!-- Bouton retour -->
  <a href="index.html" style="
    position: fixed;
    top: 30px;
    right: 50px;
    padding: 8px 12px;
    background-color: #444;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-size: 14px;
    z-index: 100;">Refermer le livre</a>

<div id="control-panel">
  <label>Couleur fond : <input type="color" id="bgColor" value="#f0e6d2" onchange="updateBackground()"></label>
</div>

<div id="top-space"></div>

<div id="book">
  <div id="contenu">Chargement...</div>
</div>

<div id="bottom-space"></div>

<script>
  // Liste des pages (fichier HTML)
  const pages = [
    'cover.html',            // Page de couverture
    'page_vierge.html',      // Double page vierge
	'page_vierge.html',      // Double page vierge
    'avant_propos.html',     // Double page avant-propos
    'page_vierge.html',      // Double page vierge
    'intro.html',            // Double page introduction
	'page_vierge.html',      // Double page vierge
    'chapitre1.html',        // Double page chapitre 1
	'page_vierge.html',      // Double page vierge
    'chapitre2.html',        // Double page chapitre 2
	'page_vierge.html',      // Double page vierge
	'chapitre3.html',        // Double page chapitre 3
	'chapitre4.html',        // Double page chapitre 4
	'chapitre4b.html',       // Double page chapitre 4b
  ];

  let currentIndex = 0; // index de la première page de la double page affichée

  // Fonction pour charger deux pages côte à côte
function loadDoublePages(index) {
    // Vérifier si on peut charger deux pages
    const nextIndex = index + 1;
    if (nextIndex >= pages.length) {
        // Si pas de page suivante, charger une seule
        fetch(pages[index])
            .then(res => res.text())
            .then(html => {
                document.getElementById('contenu').innerHTML = `
                <div style="display:flex; flex-direction:column; height:100%;">
                    <div style="flex:1; border:1px solid #ccc; padding:10px;">${html}</div>
                </div>`;
		// Appliquer la classe selon la page
        if (pages[currentIndex].includes('chapitre1.html')) {
            document.getElementById('contenu').className = 'chapitre1';
        } else {
            document.getElementById('contenu').className = '';
        }
		if (pages[currentIndex].includes('chapitre2.html')) {
            document.getElementById('contenu').className = 'chapitre2';
        } else {
            document.getElementById('contenu').className = '';
        }	
		if (pages[currentIndex].includes('chapitre3.html')) {
            document.getElementById('contenu').className = 'chapitre3';
        } else {
            document.getElementById('contenu').className = '';
        }	
                currentIndex = index;
                updateNavigationButtons();
            });
    } else {
        // Charger deux pages côte à côte
        Promise.all([
            fetch(pages[index]),
            fetch(pages[nextIndex])
        ])
        .then(responses => Promise.all(responses.map(r => r.text())))
        .then(contents => {
            document.getElementById('contenu').innerHTML = `
            <div style="display:flex; gap:10px; height:100%;">
                <div style="flex:1; border:1px solid #ccc; padding:10px; overflow:auto;">${contents[0]}</div>
                <div style="flex:1; border:1px solid #ccc; padding:10px; overflow:auto;">${contents[1]}</div>
            </div>`;
		// Appliquer la classe selon la page
        if (pages[currentIndex].includes('chapitre1.html')) {
            document.getElementById('contenu').className = 'chapitre1';
        } else {
            document.getElementById('contenu').className = '';
        }
		if (pages[currentIndex].includes('chapitre2.html')) {
            document.getElementById('contenu').className = 'chapitre2';
        } else {
            document.getElementById('contenu').className = '';
        }
		if (pages[currentIndex].includes('chapitre3.html')) {
            document.getElementById('contenu').className = 'chapitre3';
        } else {
            document.getElementById('contenu').className = '';
        }		
            currentIndex = index;
            updateNavigationButtons();
        });
    }
  }

  // Mettre à jour les boutons "Précédent / Suivant"
function updateNavigationButtons() {
    // Supprimer les anciens boutons
    document.querySelectorAll('.nav-button').forEach(b => b.remove());

    // Bouton Précédent
    if (currentIndex > 0) {
        const btnPrev = document.createElement('div');
        btnPrev.className = 'nav-button corner-left';
        btnPrev.innerHTML = '◣';
        btnPrev.onclick = () => loadDoublePages(currentIndex - 2);
        document.getElementById('contenu').appendChild(btnPrev);
    }

    // Bouton Suivant
    if (currentIndex + 2 < pages.length) {
        const btnNext = document.createElement('div');
        btnNext.className = 'nav-button corner-right';
        btnNext.innerHTML = '◢';
        btnNext.onclick = () => loadDoublePages(currentIndex + 2);
        document.getElementById('contenu').appendChild(btnNext);
    }
  }

  function updateBackground() {
    document.body.style.backgroundColor = document.getElementById('bgColor').value;
  }

  // Charger la première double page au démarrage
window.onload = () => {
    updateBackground();
    loadDoublePages(0);
};
</script>

</body>
</html>
